services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Go wallboard: `docker compose run --rm wallboard` (no Go install needed).
  # It only reads Redis, so it works the same with the app run via Maven or in Docker.
  wallboard:
    build: ./wallboard
    profiles: ["wallboard"]
    depends_on:
      - redis
    environment:
      REDIS_ADDR: redis:6379

  # Optional: run the app in Docker too (`docker compose --profile full up --build`).
  # SIP over UDP works through the port mapping (checked with Docker Desktop on Windows): Docker rewrites
  # the source address, but callgen.py sends `rport`, so responses go back to where the packet came from,
  # and SIP_ADVERTISE_HOST puts 127.0.0.1:5060 in our Contact so ACK and BYE reach the mapped port.
  app:
    build: .
    profiles: ["full"]
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      SIP_BIND_HOST: 0.0.0.0
      SIP_ADVERTISE_HOST: 127.0.0.1
    ports:
      - "8080:8080"
      - "5060:5060/udp"
