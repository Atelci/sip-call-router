spring:
  application:
    name: sip-call-router
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

callrouter:
  sip:
    bind-host: ${SIP_BIND_HOST:127.0.0.1}
    advertise-host: ${SIP_ADVERTISE_HOST:127.0.0.1}
    port: ${SIP_PORT:5060}
  max-queue-size: 5
  # agent id -> skills. Callers pick a skill by the user they dial: sip:billing@... goes to the
  # billing queue; sip:support@... (or any name that is not a skill) is a general call for anyone.
  agents:
    alice: [en, billing]
    bob: [en]
    carol: [de, billing]

logging:
  # Also written to a file so LogTailer can stream it to the browser page (console output stays as is).
  file:
    name: ${LOG_FILE:logs/sip-call-router.log}
  pattern:
    file: "%d{HH:mm:ss.SSS} %-5level [%15.15thread] %-32.32logger{30} : %msg%n"
  level:
    io.github.atelci.callrouter: INFO
    call-events: INFO
