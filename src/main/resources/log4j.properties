# Only used by the JAIN-SIP stack (log4j 1.x API via reload4j). App logging is Logback.
log4j.rootLogger=WARN, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss.SSS} %-5p [jain-sip] %m%n
